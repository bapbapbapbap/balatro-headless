# Model v6, DAgger's attribution twin (docs/hypotheses-v6.md, 2026-11-21 23:42 section; run page docs/runs/v6dt.md):
# round 1's training without the DAgger games: from v6e's best.pt, imitation on teach_v6 alone, up to 8 passes,
# then the 600-game eval. Started by train/step3.sh after DAgger round 1.

[run]
start = "warm:{work}/runs/v6e/best.pt"
hours = 24
workers = 12
checks = ["repo", "fixture-replay", "ordered", "diff", "v4-credit", "v4-phase", "v4-phi", "v5-play", "v6-imitate"]
mirror_dir = "/mnt/f/balatro data/{run}"
spill_dir = "/mnt/f/balatro data"
publish_on_stop = false

# train.py's settings (train/options.py); anything not listed keeps its default there.
[train]
# the model: v5's (two networks, encoding 2, ordered actions with the joker-drag cap, offer and play values)
phase_split = true
d = 192
layers = 4
heads = 6
enc = 2
actions = "ordered-capped"
offer_values = true
play_values = true
# the reward the value head learns (v4b's), and its credit settings (used again from stage 3)
reward = "blinds"
build_shaping = 1
gamma_blind = 0.95
lam_blind = 0.95
lam_hand = 0.8
shop_ent = "0.001"
# imitation (train/imitate.py) on all teacher data so far, then one eval, then stop
imitate = "{work}/teach_v6"
imitate_epochs = 8
imitate_patience = 2
imitate_lr = 3e-4
imitate_only = 1
seed = 3
lr = 1e-4
# the game
back = "b_red"
stake = 1
# the eval
eval_games = 600
eval_every = 1
max_wins = 1000000

# --smoke: runs/v6d-smoke, 40 teacher games, one pass, a 12-game eval, then stop
[smoke]
imitate_max_games = 40
imitate_epochs = 1
eval_games = 12
hours = 1
